name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qrv-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qrv
          POSTGRES_PASSWORD: qrv
          POSTGRES_DB: qrv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrv -d qrv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qrv:qrv@127.0.0.1:5432/qrv_test
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:prod
      - run: docker build --tag qrv-api:ci .
      - run: npm run migrate
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
